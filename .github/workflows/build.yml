name: Build Padavan

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Padavan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware in Docker
        run: |
          sudo mkdir -p /opt/images
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "/opt/images:/opt/images" \
            ubuntu:20.04 \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y libtool-bin gperf python3-docutils autopoint gettext \
                git sudo fakeroot ca-certificates xz-utils curl
              ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

              git clone --depth=1 https://github.com/hanwckf/rt-n56u.git /opt/rt-n56u

              curl -L https://github.com/TurBoTse/padavan-toolchain/releases/download/toolchain/mipsel-linux-uclibc.tar.xz -o /tmp/toolchain.tar.xz
              tar -xf /tmp/toolchain.tar.xz -C /opt/rt-n56u/toolchain-mipsel/
              rm -f /tmp/toolchain.tar.xz

              for model in R6220; do
                if [ -f /workspace/config/${model}.config ]; then
                  cp -f /workspace/config/${model}.config /opt/rt-n56u/trunk/configs/templates/${model}.config
                fi
              done

              cd /opt/rt-n56u/trunk
              for model in R6220; do
                echo "Building $model..."
                fakeroot ./build_firmware_ci $model
                if [ $? -eq 0 ]; then
                  cp -f images/*.trx /opt/images/Hanwckf_${model}_$(date +%Y%m%d).trx
                  echo "Build $model succeeded"
                else
                  echo "Build $model failed"
                  exit 1
                fi
                ./clear_tree_simple >/dev/null 2>&1
              done
            '

      - name: Upload firmware to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Padavan-${{ github.run_number }}
          name: Padavan Build ${{ github.run_number }}
          files: /opt/images/*.trx
          body: |
            Padavan firmware for R6220
            Build date: $(date +%Y-%m-%d)
            Commit: ${{ github.sha }}
