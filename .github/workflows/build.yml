name: Build Padavan

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  toolchain_pkg: mipsel-linux-uclibc.tar.xz
  toolchain_url: https://github.com/TurBoTse/padavan-toolchain/releases/download/toolchain

jobs:
  build:
    name: Build Padavan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain-mipsel
          key: toolchain-mipsel-${{ env.toolchain_pkg }}

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/toolchain-mipsel
          curl -LO ${{ env.toolchain_url }}/${{ env.toolchain_pkg }}
          tar -xf ${{ env.toolchain_pkg }} -C ${{ github.workspace }}/toolchain-mipsel
          rm -f ${{ env.toolchain_pkg }}

      - name: Prepare source tree
        run: |
          sudo rm -rf /opt/rt-n56u
          sudo git clone --depth=1 https://github.com/hanwckf/rt-n56u.git /opt/rt-n56u
          sudo rm -rf /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x
          sudo cp -a ${{ github.workspace }}/toolchain-mipsel/toolchain-3.4.x /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x
          for model in R6220; do
            if [ -f config/${model}.config ]; then
              sudo cp -f config/${model}.config /opt/rt-n56u/trunk/configs/templates/${model}.config
            fi
          done

      - name: Build firmware in Docker
        run: |
          sudo mkdir -p /opt/images
          docker run --rm \
            -v "/opt/rt-n56u:/opt/rt-n56u" \
            -v "/opt/images:/opt/images" \
            ubuntu:20.04 \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y libtool-bin gperf python3-docutils autopoint gettext \
                git sudo fakeroot ca-certificates
              ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

              cd /opt/rt-n56u/trunk
              for model in R6220; do
                echo "Building $model..."
                fakeroot ./build_firmware_ci $model
                if [ $? -eq 0 ]; then
                  cp -f images/*.trx /opt/images/Hanwckf_${model}_$(date +%Y%m%d).trx
                  echo "Build $model succeeded"
                else
                  echo "Build $model failed"
                  exit 1
                fi
                ./clear_tree_simple >/dev/null 2>&1
              done
            '

      - name: Upload firmware to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Padavan-${{ github.run_number }}
          name: Padavan Build ${{ github.run_number }}
          files: /opt/images/*.trx
          body: |
            Padavan firmware for R6220
            Build date: $(date +%Y-%m-%d)
            Commit: ${{ github.sha }}
