name: Build Padavan

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  build_dir: /opt/rt-n56u
  images_dir: /opt/images
  work_dir: /opt/rt-n56u/trunk
  src_git: https://github.com/hanwckf/rt-n56u.git
  config_dir: /opt/rt-n56u/trunk/configs/templates
  toolchain_dir: /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x
  toolchain_pkg: mipsel-linux-uclibc.tar.xz
  toolchain_url: https://github.com/TurBoTse/padavan-toolchain/releases/download/toolchain
  models: R6220
  build_variant: mt7621

jobs:
  build:
    name: Build Padavan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.toolchain_dir }}
          key: toolchain-mipsel-${{ env.toolchain_pkg }}

      - name: Prepare toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.toolchain_dir }}
          curl -LO ${{ env.toolchain_url }}/${{ env.toolchain_pkg }}
          tar -xf ${{ env.toolchain_pkg }} -C ${{ env.toolchain_dir }}
          rm -f ${{ env.toolchain_pkg }}

      - name: Build firmware in Docker
        run: |
          sudo mkdir -p ${{ env.images_dir }}
          docker run --rm \
            -v "$(pwd):/workspace" \
            -v "${{ env.toolchain_dir }}:/toolchain" \
            -v "${{ env.images_dir }}:/opt/images" \
            -e images_dir=/opt/images \
            ubuntu:20.04 \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y libtool-bin gperf python3-docutils autopoint gettext \
                git sudo fakeroot ca-certificates
              ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

              git clone --depth=1 https://github.com/hanwckf/rt-n56u.git /opt/rt-n56u
              ln -sf /toolchain /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x

              for model in R6220; do
                if [ -f /workspace/config/${model}.config ]; then
                  cp -f /workspace/config/${model}.config /opt/rt-n56u/trunk/configs/templates/${model}.config
                fi
              done

              cd /opt/rt-n56u/trunk
              for model in R6220; do
                echo "Building $model..."
                fakeroot ./build_firmware_ci $model
                if [ $? -eq 0 ]; then
                  cp -f images/*.trx /opt/images/Hanwckf_${model}_$(date +%Y%m%d).trx
                  echo "Build $model succeeded"
                else
                  echo "Build $model failed"
                  exit 1
                fi
                ./clear_tree_simple >/dev/null 2>&1
              done
            '

      - name: Upload firmware to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Padavan-${{ github.run_number }}
          name: Padavan Build ${{ github.run_number }}
          files: ${{ env.images_dir }}/*.trx
          body: |
            Padavan firmware for ${{ env.models }}
            Build date: $(date +%Y-%m-%d)
            Commit: ${{ github.sha }}
